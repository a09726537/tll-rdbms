# TLL-RDBMS — RAG Index Builder / Retrieval Config
version: "1.0"
schema_version: "tll-rag-index-0.1"
created_at_utc: "2025-09-06"
description: >
  Configuration for building and querying the RAG knowledge index used by SQL guardrails
  and analyst assistance. Emphasizes privacy-by-design, reproducibility, and auditability.

# ---------------------------
# Corpus sources (add/remove as needed)
# ---------------------------
corpus:
  - id: "docs_markdown"
    type: "filesystem"
    root: "docs/"
    include_globs: ["**/*.md", "**/*.markdown"]
    exclude_globs: ["**/.git/**", "**/node_modules/**", "**/build/**"]
    default_metadata:
      source: "docs"
      license: "internal"
  - id: "runbooks"
    type: "filesystem"
    root: "tll_vm_runbook/"
    include_globs: ["**/*.md", "**/*.txt", "**/*.pdf"]
    exclude_globs: ["**/archive/**"]
    default_metadata:
      source: "runbook"
      confidentiality: "internal"
  - id: "policies"
    type: "filesystem"
    root: "policies/"
    include_globs: ["**/*.md", "**/*.pdf"]
    default_metadata:
      source: "policy"
      confidentiality: "internal"
  - id: "schemas"
    type: "filesystem"
    root: "schemas/"
    include_globs: ["**/*.md", "**/*.sql", "**/*.yaml"]
    default_metadata:
      source: "schema"
      confidentiality: "internal"

# ---------------------------
# Preprocessing (cleaning / privacy)
# ---------------------------
preprocess:
  text_normalization:
    strip_whitespace: true
    collapse_newlines: true
    unicode_nfkc: true
  codeblocks:
    keep: true
    languages_allowlist: ["sql", "bash", "powershell", "json", "yaml", "ini"]
    max_block_chars: 20000
  images:
    ocr: false
  pdf:
    extract_strategy: "auto"        # "auto" | "layout" | "fast"
    max_pages: 500
  redaction:
    enabled: true
    patterns:
      # Basic examples; extend to your needs (no raw secrets in docs)
      - name: "email"
        regex: "(?i)[A-Z0-9._%+-]+@[A-Z0-9.-]+\\.[A-Z]{2,}"
      - name: "iban"
        regex: "(?i)\\b[A-Z]{2}[0-9]{2}[A-Z0-9]{1,30}\\b"
      - name: "pan_like"
        regex: "\\b(?:\\d[ -]*?){13,19}\\b"
    replace_with: "<REDACTED>"
  metadata:
    compute_sha256: true
    add_document_id: "uuid4"
    fields_from_path:
      - pattern: "(?i)(?<category>docs|runbook|policy|schema)"
        assign_to: "category"
    extra:
      repo_commit: "<git-short-sha>"      # fill during pipeline run
      snapshot_id: "<snapshot-tag>"       # e.g., docs-2025Q3

# ---------------------------
# Chunking
# ---------------------------
chunking:
  default:
    method: "token"
    tokenizer: "bert-base-uncased"   # used only for counting; not the embedder
    size: 512
    overlap: 64
    respect_sentence_boundary: true
    min_chars: 200
    max_chars: 4000
  overrides:
    - when_glob: "**/*.sql"
      method: "line"
      max_lines: 120
      overlap_lines: 10
    - when_glob: "**/*.md"
      method: "heading"
      max_section_chars: 5000
      overlap: 128

# ---------------------------
# Embeddings
# ---------------------------
embeddings:
  provider: "huggingface"                 # "huggingface" | "openai" | "azureopenai" | "vertexai"
  model: "intfloat/e5-base-v2"            # good general retriever; replace as needed
  normalize: true
  pooling: "mean"
  batch_size: 64
  device: "auto"                          # "cpu" | "cuda" | "mps" | "auto"
  cache_dir: ".cache/embeddings"
  timeout_s: 120
  rate_limit:
    max_rps: 5
    max_batch: 64

# ---------------------------
# Index storage (FAISS + docstore)
# ---------------------------
index:
  kind: "faiss"
  index_dir: "rag/index/faiss"
  docstore:
    kind: "sqlite"
    uri: "rag/index/docstore.sqlite"
  faiss:
    factory: "HNSW32,Flat"   # HNSW w/ 32 links + exact refinement; consider IVF for very large corpora
    hnsw:
      m: 32
      ef_construction: 200
      ef_search: 64
    train_on_build: true
    metric: "cosine"         # or "l2" if your embeddings are not normalized
  manifest_path: "rag/index/manifest.json"
  overwrite: false           # set true to rebuild from scratch
  incremental:
    enabled: true
    detect_moves: true
    rename_threshold: 0.85

# ---------------------------
# Retrieval settings
# ---------------------------
retrieval:
  top_k: 5
  min_score: 0.20                  # cosine similarity threshold after normalization
  hybrid:
    enabled: true
    bm25_weight: 0.35
    embed_weight: 0.65
    bm25:
      analyzer: "english"
      k1: 1.2
      b: 0.75
  rerank:
    enabled: true
    model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    top_k_rerank: 20
    return_top_k: 5
  filters:
    metadata_must_not:
      - field: "confidentiality"
        values: ["secret", "restricted"]
    metadata_must:
      - field: "license"
        values: ["internal", "public"]
  response:
    include_snippets: true
    snippet_chars: 320
    include_citations: true
    max_tokens_answer_hint: 512

# ---------------------------
# Build / Refresh
# ---------------------------
build:
  mode: "incremental"          # "full" | "incremental"
  refresh_schedule_cron: "0 3 * * *"   # daily at 03:00
  max_workers: 4
  retry:
    max_attempts: 3
    backoff_s: 2
  logging:
    level: "INFO"
    logfile: "rag/index/build.log"
    audit_log: "rag/index/audit.jsonl"

# ---------------------------
# Evaluation (optional)
# ---------------------------
evaluation:
  queries_path: "rag/examples/queries.json"
  metrics: ["nDCG@5", "Recall@5", "MRR@5"]
  holdout_fraction: 0.2
  seed: 42

# ---------------------------
# Safety / Governance
# ---------------------------
safety:
  allow_disallowed_tables: false
  enforce_citations: true
  max_context_tokens: 2048
  pii_redaction_in_context: true
  strip_secrets_from_snippets: true

# ---------------------------
# Reproducibility
# ---------------------------
reproducibility:
  seed: 20250906
  software:
    python: ">=3.10"
    faiss: ">=1.7"
    numpy: ">=1.24"
    pandas: ">=2.0"
    transformers: ">=4.40"
  emit_build_manifest: true
  attach_sha256_to_docs: true
