apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-dac-deployment
  namespace: aida
  labels:
    app: ai-dac
    module: tll
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-dac
      module: tll
  template:
    metadata:
      labels:
        app: ai-dac
        module: tll
        tier: backend
    spec:
      # If you use a custom service account, set it here
      # serviceAccountName: ai-dac-sa

      # GPU scheduling (requires NVIDIA device plugin on the cluster)
      containers:
        - name: ai-dac
          # ⚠️ Change this to your actual built image
          image: aida-tll:latest
          imagePullPolicy: IfNotPresent

          # Main app port (adjust if needed)
          ports:
            - name: http
              containerPort: 8000

          # Environment from ConfigMap + Secret
          envFrom:
            - configMapRef:
                name: aida-dac-config
            - secretRef:
                name: aida-dac-secrets   # create this separately (for DB passwords, JWT, etc.)

          # Optional extra env for flexibility
          env:
            - name: PYTHONUNBUFFERED
              value: "1"

          # Liveness / Readiness probes
          # Paths and behavior use the values from configmap.yaml:
          #   HEALTHCHECK_PATH, LIVENESS_PATH, READINESS_PATH
          # Here we assume the app exposes them on port 8000.
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

          resources:
            limits:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: 1     # request one GPU
            requests:
              cpu: "500m"
              memory: "1Gi"

          # Optional: mount a models volume, if you store checkpoints on a PVC
          volumeMounts:
            - name: models-volume
              mountPath: /opt/aida/models
            - name: rag-volume
              mountPath: /opt/aida/rag

      # Volumes (PVCs defined elsewhere)
      volumes:
        - name: models-volume
          persistentVolumeClaim:
            claimName: ai-dac-models-pvc
        - name: rag-volume
          persistentVolumeClaim:
            claimName: ai-dac-rag-pvc

      # Node selector / tolerations for GPU nodes if your cluster uses them
      # nodeSelector:
      #   gpu: "true"
      #
      # tolerations:
      #   - key: "nvidia.com/gpu"
      #     operator: "Exists"
      #     effect: "NoSchedule"

